name: Build Agent Executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:   # 也允许手动触发

jobs:
  # ── Windows .exe ────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller psutil requests

      - name: Build Windows .exe
        working-directory: agent
        run: |
          pyinstaller --onefile --console --name "NetMonitor-Agent-Win" agent.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Agent-Windows
          path: agent/dist/NetMonitor-Agent-Win.exe

  # ── macOS binary ────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller psutil requests

      - name: Build macOS binary
        working-directory: agent
        run: |
          pyinstaller --onefile --console --name "NetMonitor-Agent-Mac" agent.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Agent-macOS
          path: agent/dist/NetMonitor-Agent-Mac

  # ── Create GitHub Release (tag 触发时) ──────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: NetMonitor-Agent-Windows
          path: release/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: NetMonitor-Agent-macOS
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NetMonitor-Agent-Win.exe
            release/NetMonitor-Agent-Mac
          body: |
            ## NetMonitor Agent — ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Windows | `NetMonitor-Agent-Win.exe` |
            | macOS | `NetMonitor-Agent-Mac` |

            ### 使用方法
            1. 下载对应平台的文件
            2. 运行——首次启动会自动搜索服务器（UDP广播）
            3. 若局域网内有服务器运行，自动连接；否则手动输入 IP
          generate_release_notes: true
