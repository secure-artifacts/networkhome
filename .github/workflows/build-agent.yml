name: Build Agent Executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ── Windows .exe ────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller psutil requests pystray Pillow

      - name: Build Windows .exe (no console)
        working-directory: agent
        run: |
          pyinstaller --onefile --windowed --name "NetMonitor-Agent-Win" `
            --hidden-import pystray._win32 `
            --hidden-import PIL.ImageFont `
            --hidden-import PIL.ImageDraw `
            --hidden-import winreg `
            --hidden-import tkinter `
            --hidden-import tkinter.simpledialog `
            agent.py

      - uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Agent-Windows
          path: agent/dist/NetMonitor-Agent-Win.exe

  # ── macOS binary ────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller psutil requests pystray Pillow

      - name: Build macOS binary (no console)
        working-directory: agent
        run: |
          pyinstaller --onefile --windowed --name "NetMonitor-Agent-Mac" \
            --hidden-import pystray._darwin \
            --hidden-import PIL.ImageFont \
            --hidden-import PIL.ImageDraw \
            --hidden-import tkinter \
            --hidden-import tkinter.simpledialog \
            agent.py

      - uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Agent-macOS
          path: agent/dist/NetMonitor-Agent-Mac

  # ── GitHub Release (tag 触发) ───────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: NetMonitor-Agent-Windows, path: release/ }

      - uses: actions/download-artifact@v4
        with: { name: NetMonitor-Agent-macOS, path: release/ }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NetMonitor-Agent-Win.exe
            release/NetMonitor-Agent-Mac
          body: |
            ## NetMonitor Agent ${{ github.ref_name }}

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🪟 Windows | `NetMonitor-Agent-Win.exe` | 双击运行，无控制台 |
            | 🍎 macOS | `NetMonitor-Agent-Mac` | `chmod +x` 后运行 |

            **功能：**
            - 系统托盘图标（绿=连接 / 黄=连接中 / 红=断开）
            - 首次运行自动发现服务器（UDP），失败时手动输入
            - 右键菜单可修改设备名称、服务器地址、开机自启、退出
          generate_release_notes: true
